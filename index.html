<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Латин - Кирилл хөрвүүлэгч</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Латин ➔ Кирилл хөрвүүлэгч</h1>
        <p>Галиг болон чатын товчлолуудыг (bn, snu г.м) автоматаар хөрвүүлнэ.</p>
        
        <div class="textarea-group">
            <div class="box">
                <label for="latinInput">Латин (Галиг):</label>
                <textarea id="latinInput" placeholder="Sain baina uu? Odoogoor yu hiij bn daa..." autofocus></textarea>
            </div>
            
            <div class="box">
                <label for="cyrillicOutput">Кирилл:</label>
                <textarea id="cyrillicOutput" readonly placeholder="Сайн байна уу? Одоогоор юу хийж байна даа..."></textarea>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
