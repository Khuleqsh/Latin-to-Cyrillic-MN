<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <header class="top-nav">
            <div class="logo-section">
                <span class="logo" id="ui-title">Converter</span>
                <span class="ai-badge">AI Powered</span>
            </div>
            <div class="controls">
                <button id="historyToggle" class="icon-btn" title="History">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </button>
                <button id="langToggle" class="icon-btn">EN</button>
                <button id="themeToggle" class="icon-btn">
                    <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg id="sun-icon" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </header>

        <main class="container">
            <div class="converter-header">
                <span id="label-left" class="lang-label">Latin</span>
                <button id="swapBtn" class="swap-btn" title="Swap">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 8 16 13"></polyline><line x1="21" y1="8" x2="9" y2="8"></line><polyline points="8 21 3 16 8 11"></polyline><line x1="3" y1="16" x2="15" y2="16"></line></svg>
                </button>
                <span id="label-right" class="lang-label">Cyrillic</span>
            </div>
            
            <div class="textarea-group">
                <div class="box input-box">
                    <button id="clearBtn" class="clear-btn" title="Clear">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                    <textarea id="inputText" placeholder="ymr ch ugiig yrn bl..." autofocus></textarea>
                    
                    <div class="box-footer">
                        <span id="counterText" class="counter">Words: 0 | Chars: 0</span>
                        <div class="footer-actions">
                            <label for="fileInput" class="text-btn" id="ui-import">Import</label>
                            <input type="file" id="fileInput" accept=".txt" style="display: none;">
                        </div>
                    </div>
                </div>
                
                <div class="box output-box">
                    <div id="loadingIndicator" class="loading-overlay" style="display: none;">
                        <div class="spinner"></div>
                        <span id="ui-thinking">AI is processing...</span>
                    </div>
                    <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
                    
                    <div class="box-footer">
                        <button id="exportBtn" class="text-btn" id="ui-export">Export</button>
                        <button id="copyBtn" class="copy-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span id="ui-copy">Copy</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <p id="ui-desc">Powered by AI Language Models</p>
        </footer>
    </div>

    <div id="historyModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="ui-history-title">History</h3>
                <button id="closeHistory" class="icon-btn close-modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
