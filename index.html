<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хөрвүүлэгч · KhuleqSH</title><link rel="stylesheet" href="style.css"></head>
<body data-theme="light">
<div class="app-wrapper">
  <nav class="top-nav">
    <div class="logo"><span class="dot"></span><span id="ui-title">Хөрвүүлэгч</span><em>AI</em></div>
    <div class="controls">
      <button id="aiToggle" class="pill on" title="AI on/off">AI</button>
      <button class="icon-btn" id="historyToggle" title="History"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
      <button class="icon-btn" id="langToggle">EN</button>
      <button class="icon-btn" id="themeToggle" title="Theme">
        <svg id="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="sun-icon" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <div class="converter-header">
      <span class="lang-label" id="label-left">Латин (Ухаалаг)</span>
      <button class="swap-btn" id="swapBtn" title="Alt+S">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <span class="lang-label" id="label-right">Кирилл</span>
    </div>

    <div class="textarea-group">
      <div class="box">
        <button class="clear-btn" id="clearBtn" title="Ctrl+K">✕</button>
        <textarea id="inputText" data-ph="phIn" spellcheck="false" autofocus></textarea>
        <div class="box-footer">
          <span class="counter" id="counterText"></span>
          <span class="row">
            <button class="text-btn" id="pasteBtn" data-i18n="paste">Буулгах</button>
            <label class="text-btn" for="fileInput" data-i18n="import">Оруулах</label>
            <input type="file" id="fileInput" accept=".txt" hidden>
          </span>
        </div>
      </div>

      <div class="box output-box">
        <textarea id="outputText" data-ph="phOut" spellcheck="false"></textarea>
        <div class="box-footer">
          <span class="row">
            <span class="counter" id="status"></span>
            <span class="fb" id="fb" hidden>
              <span class="counter" data-i18n="rate">AI зөв хөрвүүлсэн үү?</span>
              <button class="text-btn" id="fbUp">👍</button><button class="text-btn" id="fbDown">👎</button>
            </span>
          </span>
          <span class="row">
            <button class="text-btn" id="exportBtn" data-i18n="export">Татах</button>
            <button class="copy-btn" id="copyBtn" title="Alt+C"><span id="ui-copy" data-i18n="copy">Хуулах</span></button>
          </span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Made with ♥ by <b>KhuleqSH</b></p>
    <p class="keys"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> AI · <kbd>Ctrl</kbd>+<kbd>K</kbd> цэвэрлэх · <kbd>Ctrl</kbd>+<kbd>S</kbd> татах · <kbd>Ctrl</kbd>+<kbd>O</kbd> оруулах · <kbd>Alt</kbd>+<kbd>C</kbd> хуулах · <kbd>Alt</kbd>+<kbd>S</kbd> солих</p>
  </footer>
</div>

<div class="modal-overlay" id="historyModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header"><h3 id="ui-history-title" data-i18n="hist">Сүүлийн түүх</h3><button class="icon-btn" id="closeHistory">✕</button></div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>
<div id="toast"></div>

<script src="script.js"></script>
</body></html>
